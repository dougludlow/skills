interface:
  display_name: "Orchestrate"
  short_description: "Orchestrate worker chats and verified project outcomes"
  default_prompt: "Use $orchestrate for this project. Create a separate worker chat and worktree for each PR. Delegate implementation, investigation, checks, PR actions, and follow-up corrections to workers. I authorize project communication in both directions between the orchestrator and every worker it creates, including assignments, steering, questions, blockers, status, and results, without approval per message or worker. Keep the project plan current and deliver verified draft PRs for my review."
policy:
  allow_implicit_invocation: false
